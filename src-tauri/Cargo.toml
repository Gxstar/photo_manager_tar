[package]
name = "photo_manager_tar"
version = "0.1.0"
description = "SD card photo/video copy & organize tool"
authors = ["gengx"]
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "photo_manager_tar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2.5"
exif = { package = "kamadak-exif", version = "0.6.1" }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }
# 图库：Shell 原生缩略图（IShellItemImageFactory）+ JPEG 编码 + thumb:// 协议路径解码
windows = { version = "0.62", features = [
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
percent-encoding = "2"
tokio = { version = "1", features = ["sync"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
notify-debouncer-full = "0.7.0"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
